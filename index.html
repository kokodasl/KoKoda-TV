<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoKoda TV | Entertainment Guide</title><style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#edf5f5;font:16px/1.55 system-ui,sans-serif}main,header>div{max-width:1100px;margin:auto;padding:24px}header{background:linear-gradient(120deg,#183b3b,#11191d);border-bottom:1px solid #315454}h1{font-size:clamp(38px,7vw,72px);letter-spacing:-3px;margin:0;color:#71ded4}h2{margin:0 0 12px}small,.muted{color:#a6babb}header p{margin:4px 0} .eyebrow{letter-spacing:3px;font-size:12px;color:#71ded4}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select{background:#1c292d;color:#fff;border:1px solid #496065;border-radius:8px;padding:12px;font:inherit}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}article{background:#1a2529;border:1px solid #30464b;border-radius:12px;padding:20px}article h3{margin:8px 0;font-size:21px}article p{margin:8px 0}.tag{font-size:12px;color:#71ded4;text-transform:uppercase;letter-spacing:1px}footer{padding:30px;text-align:center;color:#a6babb}button{background:#244b4a;color:white;border:1px solid #4a7775;border-radius:6px;padding:8px;cursor:pointer}a{color:#71ded4}</style><header><div><div class="eyebrow">PREMIUM ENTERTAINMENT SYSTEMS</div><h1>KoKoda TV</h1><p>Your World. Your Screen. Your Entertainment.</p><p class="muted">Official entertainment guide for Second Life</p></div></header><main><h2>Explore the catalogue</h2><div id="status" role="status">Loading catalogue…</div><div class="controls"><input id="search" type="search" placeholder="Search titles or descriptions" aria-label="Search catalogue"><select id="type" aria-label="Content type"><option value="">All entertainment</option><option>Movies</option><option>TV Shows</option></select><select id="genre" aria-label="Genre"><option value="">All genres</option></select></div><div id="cards" class="grid"></div></main><footer>KoKoda TV • Select entertainment using your in-world television.</footer><script>
const $=id=>document.getElementById(id), base='https://raw.githubusercontent.com/kokodasl/KoKoda-TV/main/';let items=[],errors=[];
async function get(path){const r=await fetch(base+path,{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.text()}
function rows(t){return t.split(/\r?\n/).map(s=>{let i=s.indexOf('|');return i>0?[s.slice(0,i).trim(),s.slice(i+1).trim()]:null}).filter(x=>x&&x[0]&&x[1])}
function el(tag,t,cls){let e=document.createElement(tag);e.textContent=t;if(cls)e.className=cls;return e}
function render(){let q=$('search').value.toLowerCase(),type=$('type').value,g=$('genre').value;let filtered=items.filter(x=>(!type||x.type===type)&&(!g||x.genre===g)&&[x.title,x.description,x.cast,x.genre,x.year].join(' ').toLowerCase().includes(q));$('cards').replaceChildren();for(let x of filtered){let a=el('article','');a.append(el('div',x.type+' · '+x.genre,'tag'),el('h3',x.title+(x.year?' ('+x.year+')':'')),el('p',x.description||'Description coming soon.'));if(x.cast)a.append(el('p','Starring: '+x.cast,'muted'));if(x.seasons)a.append(el('p',x.seasons+' seasons · '+(x.incomplete?'at least ':'')+x.episodes+' episodes','muted'));$('cards').append(a)}if(!filtered.length)$('cards').append(el('p','No matching titles.'))}
async function safe(path){try{return rows(await get(path))}catch(e){errors.push(e.message);return []}}
async function init(){let meta={};try{meta=JSON.parse(await get('guide-metadata.json'))}catch(e){errors.push('Descriptions unavailable')};let version='unknown';try{version=(await get('version.txt')).trim()}catch(e){errors.push('Version unavailable')};let movies=await safe('movies.txt'),shows=await safe('television.txt');for(let [genre,path] of movies){for(let [title] of await safe(path)){items.push({...meta[title],title,type:'Movies',genre})}}for(let [title,path] of shows){let seasons=await safe(path),episodes=0,before=errors.length;for(let [,p] of seasons)episodes+=(await safe(p)).length;items.push({...meta[title],title,type:'TV Shows',genre:meta[title]?.genre||'Television',seasons:seasons.length,episodes,incomplete:errors.length>before})}items.sort((a,b)=>a.title.localeCompare(b.title));for(let g of [...new Set(items.map(x=>x.genre))].sort())$('genre').append(el('option',g));$('status').textContent=`${items.filter(x=>x.type==='Movies').length} movies · ${items.filter(x=>x.type==='TV Shows').length} shows · Catalogue v${version}`+(errors.length?' · Some information could not be loaded. Refresh to retry.':'');render()}
for(let id of ['search','type','genre'])$(id).addEventListener('input',render);init().catch(()=>{$('status').textContent='Unable to load catalogue. Please refresh.'});</script></html>
